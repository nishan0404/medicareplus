{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header text-center">
                <h3 class="mb-0">
                    <i class="fas fa-sign-in-alt me-2"></i>Login to MediCare+
                </h3>
                <p class="mb-0 mt-1 opacity-75">Welcome back!</p>
            </div>
            <div class="card-body p-4">

                <form method="POST" action="/login">

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fas fa-envelope me-1 text-success"></i>Email Address
                        </label>
                        <input type="email" name="email" class="form-control"
                               placeholder="Enter your email" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="fas fa-lock me-1 text-success"></i>Password
                        </label>
                        <div class="input-group">
                            <input type="password" name="password" id="password"
                                   class="form-control" placeholder="Enter your password" required>
                            <button class="btn btn-outline-secondary" type="button"
                                    onclick="togglePassword()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i>Login
                        </button>
                    </div>

                </form>

                <div class="text-center mt-3">
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-muted small">
                        <i class="fas fa-key me-1"></i>Forgot your password?
                    </a>
                </div>

                <hr class="my-4">
                <p class="text-center mb-0">
                    Don't have an account?
                    <a href="/register" class="text-success fw-bold">Register here</a>
                </p>

            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
function togglePassword() {
    const field = document.getElementById('password');
    field.type = field.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
