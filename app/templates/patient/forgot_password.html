<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare+ | Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
        body { margin: 0; background: #F0F4F8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .auth-card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); padding: 2.25rem; width: 100%; max-width: 420px; }
        .brand { font-size: 1.75rem; font-weight: 700; color: #0B2545; text-align: center; margin-bottom: 1.5rem; }
        .auth-card h2 { font-size: 1.4rem; font-weight: 700; color: #0B2545; margin-bottom: .25rem; text-align: center; }
        .auth-card .sub { color: #64748b; font-size: .875rem; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.1rem; }
        .form-group label { font-size: .85rem; font-weight: 500; color: #374151; display: block; margin-bottom: .35rem; }
        .form-group input { width: 100%; padding: .7rem 1rem; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: .9rem; outline: none; transition: all .15s; }
        .form-group input:focus { border-color: #1A5276; box-shadow: 0 0 0 3px rgba(26,82,118,.1); }
        .btn-submit { width: 100%; padding: .75rem; background: #1A8A4A; color: white; border: none; border-radius: 8px; font-size: .95rem; font-weight: 500; cursor: pointer; transition: background .15s; }
        .btn-submit:hover { background: #157a40; }
        .back-link { display: flex; align-items: center; justify-content: center; gap: .4rem; font-size: .875rem; color: #1A5276; text-decoration: none; font-weight: 500; margin-top: 1.25rem; }
        .back-link:hover { color: #1A8A4A; }
        .flash-success { background: #dcfce7; border-radius: 8px; padding: .75rem 1rem; color: #166534; font-size: .875rem; margin-bottom: 1rem; }
        .flash-error { background: #fee2e2; border-radius: 8px; padding: .75rem 1rem; color: #991b1b; font-size: .875rem; margin-bottom: 1rem; }
        .check-circle { width: 64px; height: 64px; background: #dcfce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 1.75rem; color: #1A8A4A; }
        .info-box { background: #F0F4F8; border-radius: 8px; padding: .875rem 1rem; font-size: .85rem; color: #4b5563; margin-bottom: 1.25rem; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="brand"><i class="fas fa-heartbeat me-2" style="color:#1A8A4A;"></i>MediCare+</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="flash-{{ 'success' if category == 'success' else 'error' }}">
                <i class="fas fa-{{ 'check-circle' if category == 'success' else 'exclamation-circle' }} me-2"></i>{{ message }}
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <h2>Reset Your Password</h2>
    <p class="sub">Enter your email and we'll send a reset link</p>

    <form method="POST">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your registered email" required autofocus>
        </div>
        <button type="submit" class="btn-submit">
            <i class="fas fa-paper-plane me-2"></i>Send Reset Link
        </button>
    </form>

    <a href="{{ url_for('auth.login') }}" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Login
    </a>
</div>
</body>
</html>
