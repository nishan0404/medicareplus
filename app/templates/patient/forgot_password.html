{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header text-center">
                <h3 class="mb-0">
                    <i class="fas fa-key me-2"></i>Forgot Password
                </h3>
                <p class="mb-0 mt-1 opacity-75">We'll email you a reset link</p>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="fas fa-envelope me-1 text-success"></i>Email Address
                        </label>
                        <input type="email" name="email" class="form-control"
                               placeholder="Enter your registered email" required autofocus>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-paper-plane me-2"></i>Send Reset Link
                        </button>
                    </div>
                </form>

                <hr class="my-4">
                <p class="text-center mb-0">
                    <a href="{{ url_for('auth.login') }}" class="text-muted">
                        <i class="fas fa-arrow-left me-1"></i>Back to Login
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
