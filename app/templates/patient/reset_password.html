{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header text-center">
                <h3 class="mb-0">
                    <i class="fas fa-lock me-2"></i>Reset Password
                </h3>
                <p class="mb-0 mt-1 opacity-75">Choose a strong new password</p>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="token" value="{{ token }}">

                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fas fa-lock me-1 text-success"></i>New Password
                        </label>
                        <div class="input-group">
                            <input type="password" name="password" id="password"
                                   class="form-control" placeholder="At least 8 characters"
                                   oninput="checkStrength(this.value)" required>
                            <button class="btn btn-outline-secondary" type="button"
                                    onclick="togglePw('password')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="strength-bar mt-1" id="strength-bar"></div>
                        <small id="strength-text" class="text-muted"></small>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            <i class="fas fa-lock me-1 text-success"></i>Confirm Password
                        </label>
                        <div class="input-group">
                            <input type="password" name="confirm_password" id="confirm_password"
                                   class="form-control" placeholder="Re-enter password" required>
                            <button class="btn btn-outline-secondary" type="button"
                                    onclick="togglePw('confirm_password')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-check me-2"></i>Reset Password
                        </button>
                    </div>
                </form>

                <hr class="my-4">
                <p class="text-center mb-0">
                    <a href="{{ url_for('auth.login') }}" class="text-muted">
                        <i class="fas fa-arrow-left me-1"></i>Back to Login
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
function togglePw(id) {
    const f = document.getElementById(id);
    f.type = f.type === 'password' ? 'text' : 'password';
}

function checkStrength(pw) {
    const bar  = document.getElementById('strength-bar');
    const text = document.getElementById('strength-text');
    let score = 0;
    if (pw.length >= 8) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^a-zA-Z0-9]/.test(pw)) score++;
    if (pw.length >= 12) score++;

    bar.className = 'strength-bar mt-1 ';
    if (score <= 1) { bar.classList.add('strength-weak');   text.textContent = 'Weak'; }
    else if (score === 2) { bar.classList.add('strength-medium'); text.textContent = 'Fair'; }
    else { bar.classList.add('strength-strong'); text.textContent = 'Strong'; }
}
</script>
{% endblock %}
