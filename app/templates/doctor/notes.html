{% extends 'base.html' %}
{% block content %}

<div class="row mb-4">
    <div class="col">
        <h2 class="fw-bold" style="color:#1A5276;">
            <i class="fas fa-notes-medical me-2"></i>Consultation Notes
        </h2>
        <p class="text-muted">
            Patient: <strong>{{ appt.patient.full_name }}</strong> |
            Date: <strong>{{ appt.appointment_date.strftime('%d %B %Y') }}</strong>
        </p>
    </div>
    <div class="col-auto">
        <a href="/doctor/dashboard" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i>Back
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-edit me-2"></i>Write Consultation Notes
                </h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Diagnosis <span class="text-danger">*</span>
                        </label>
                        <input type="text" name="diagnosis" class="form-control"
                               placeholder="e.g. Upper respiratory infection"
                               value="{{ existing_note.diagnosis if existing_note else '' }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Consultation Notes <span class="text-danger">*</span>
                        </label>
                        <textarea name="notes" class="form-control" rows="6"
                                  placeholder="Write detailed consultation notes here..."
                                  required>{{ existing_note.notes if existing_note else '' }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">
                            Follow-up Date <span class="text-muted fw-normal">(optional)</span>
                        </label>
                        <input type="date" name="follow_up_date" class="form-control"
                               value="{{ existing_note.follow_up_date if existing_note and existing_note.follow_up_date else '' }}">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-save me-2"></i>Save & Complete Appointment
                        </button>
                        <a href="/doctor/appointment/{{ appt.id }}/prescriptions"
                           class="btn btn-info btn-lg">
                            <i class="fas fa-pills me-2"></i>Add Prescriptions
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
